<div class="vex-widget-historical-status">
  <mat-card class="vex-card">
    <mat-card-header class="vex-card-header">
      <div class="header-left">
        <mat-icon class="vex-card-title-icon">bar_chart</mat-icon>
        <span class="chart-title">Expedientes por Estatus - Histórico</span>
      </div>
      <div class="header-right">
        <button *ngIf="showDetails" mat-icon-button (click)="refresh()" [disabled]="loading" class="refresh-btn">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </mat-card-header>

    <mat-card-content class="vex-card-content">
      <div class="widget-content">
        <!-- Loading State -->
        <div *ngIf="loading" class="loading-container">
          <mat-spinner diameter="32"></mat-spinner>
          <p class="loading-text">Cargando datos históricos...</p>
        </div>

        <!-- Error State -->
        <div *ngIf="error && !loading" class="error-container">
          <mat-icon class="error-icon">error_outline</mat-icon>
          <p class="error-text">{{ error }}</p>
          <button mat-button color="primary" (click)="refresh()">
            <mat-icon>refresh</mat-icon>
            Reintentar
          </button>
        </div>

        <!-- Chart Content -->
        <div *ngIf="!loading && !error" class="chart-container">
          <div *ngIf="historicalStatusData.length === 0" class="no-data-container">
            <mat-icon class="no-data-icon">schedule</mat-icon>
            <p class="no-data-text">No hay datos históricos disponibles</p>
          </div>

          <ng-container *ngIf="historicalStatusData.length > 0">
            <!-- Leyenda horizontal -->
            <div class="horizontal-legend">
              <div class="legend-item" *ngFor="let item of historicalStatusData">
                <span class="legend-dot" [style.background-color]="getStatusColor(item.statusName)"></span>
                <span class="legend-label">{{ item.statusName }}</span>
              </div>
            </div>

            <!-- Gráfico -->
            <div class="chart-wrapper">
              <vex-chart
                [series]="series"
                [options]="options">
              </vex-chart>
            </div>

            <!-- Summary Stats -->
            <div class="summary-stats">
              <div class="stat-item">
                <span class="stat-label">Total Histórico:</span>
                <span class="stat-value">{{ totalCases }}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Estados:</span>
                <span class="stat-value">{{ historicalStatusData.length }}</span>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
