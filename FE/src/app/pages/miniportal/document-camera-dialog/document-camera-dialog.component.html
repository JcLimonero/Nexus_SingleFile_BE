<div class="document-camera-dialog">
  <h2 mat-dialog-title>
    <mat-icon>document_scanner</mat-icon>
    Tomar foto del documento
  </h2>

  <mat-dialog-content>
    <!-- Loading -->
    <div *ngIf="status === 'loading'" class="camera-loading">
      <mat-spinner diameter="48"></mat-spinner>
      <p>Cargando escáner de documentos...</p>
      <p class="hint">Coloca el documento sobre una superficie con buen contraste</p>
    </div>

    <!-- Error -->
    <div *ngIf="status === 'error'" class="camera-error">
      <mat-icon class="error-icon">error_outline</mat-icon>
      <p>{{ errorMessage }}</p>
    </div>

    <!-- Camera view with document detection overlay -->
    <div *ngIf="status === 'camera' || status === 'capturing'" class="camera-container">
      <div class="camera-wrapper" (touchstart)="onTouchStart($event)" (touchmove)="onTouchMove($event)" (touchend)="onTouchEnd()">
        <video #videoEl playsinline webkit-playsinline autoplay muted class="camera-video"></video>
        <canvas #canvasSource class="hidden-canvas"></canvas>
        <canvas #canvasResult class="camera-overlay"></canvas>
        <div class="document-guide" aria-hidden="true">
          <div class="document-guide-frame">
            <span class="document-guide-label">Coloca el documento aquí</span>
          </div>
        </div>
      </div>
      <div class="zoom-controls">
        <button mat-icon-button type="button" (click)="onZoomChange(zoomLevel - 0.5)" [disabled]="zoomLevel <= zoomMin" aria-label="Reducir zoom">
          <mat-icon>remove_circle_outline</mat-icon>
        </button>
        <mat-slider [min]="zoomMin" [max]="zoomMax" [step]="0.25" discrete [displayWith]="formatZoom">
          <input matSliderThumb [ngModel]="zoomLevel" (ngModelChange)="onZoomChange($event)">
        </mat-slider>
        <button mat-icon-button type="button" (click)="onZoomChange(zoomLevel + 0.5)" [disabled]="zoomLevel >= zoomMax" aria-label="Aumentar zoom">
          <mat-icon>add_circle_outline</mat-icon>
        </button>
      </div>
      <p class="camera-hint">Coloca el documento dentro del marco, sobre una superficie con contraste (ej. mesa oscura).</p>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button
      mat-raised-button
      color="primary"
      [disabled]="status !== 'camera'"
      (click)="onCapture()">
      <mat-spinner *ngIf="status === 'capturing'" diameter="20" class="btn-spinner"></mat-spinner>
      <mat-icon *ngIf="status !== 'capturing'">camera_alt</mat-icon>
      {{ status === 'capturing' ? 'Procesando...' : 'Capturar' }}
    </button>
  </mat-dialog-actions>
</div>
