<div class="clientes min-h-screen bg-gray-50 p-4">
  <div class="mb-4">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">Clientes</h1>
    
  </div>

  <mat-card class="mb-4">
    <mat-card-content>
      <div class="flex flex-wrap items-center gap-4">
        <mat-form-field appearance="outline" class="min-w-[200px]">
          <mat-label>Buscar (cliente, ndCliente)</mat-label>
          <input matInput [(ngModel)]="searchTerm" (keyup.enter)="onSearch()" placeholder="Nombre o número de cliente">
          <mat-icon matSuffix (click)="onSearch()" class="cursor-pointer">search</mat-icon>
        </mat-form-field>
        <mat-form-field appearance="outline" class="min-w-[180px]">
          <mat-label>Agencia</mat-label>
          <mat-select [(ngModel)]="filterAgency" (selectionChange)="onFilterChange()">
            <mat-option [value]="null">Todas</mat-option>
            <mat-option *ngFor="let a of agencies" [value]="a.Id">{{ a.Name }}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-checkbox [(ngModel)]="filterSoloUmbralAML" (change)="onFilterChange()" matTooltip="Mostrar solo clientes que superan el umbral AML">
          Solo en umbral AML
        </mat-checkbox>
        <button mat-stroked-button (click)="onSearch()" [disabled]="loading">
          <mat-icon>search</mat-icon>
          <span class="ml-2">Buscar</span>
        </button>
        <button mat-stroked-button (click)="clearFilters()" [disabled]="loading">
          <mat-icon>clear_all</mat-icon>
          <span class="ml-2">Limpiar filtros</span>
        </button>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-content>
      <div class="overflow-x-auto">
        <table mat-table [dataSource]="dataSource" class="w-full">
          <ng-container matColumnDef="ndCliente">
            <th mat-header-cell *matHeaderCellDef>ND Cliente</th>
            <td mat-cell *matCellDef="let row">{{ row.ndCliente }}</td>
          </ng-container>
          <ng-container matColumnDef="cliente">
            <th mat-header-cell *matHeaderCellDef>Cliente</th>
            <td mat-cell *matCellDef="let row">{{ row.cliente }}</td>
          </ng-container>
          <ng-container matColumnDef="aml">
            <th mat-header-cell *matHeaderCellDef class="w-16 text-center" matTooltip="Atención AML: operaciones que superan el umbral anual por compañía">
              <mat-icon class="align-middle text-amber-600" style="font-size: 20px; width: 20px; height: 20px;">warning</mat-icon>
            </th>
            <td mat-cell *matCellDef="let row" class="text-center">
              <mat-icon *ngIf="row.excedeUmbralAML === true || row.excedeUmbralAML === 1" class="text-amber-600" matTooltip="Cliente con operaciones que superan el umbral AML - requiere atención">warning</mat-icon>
              <span *ngIf="row.excedeUmbralAML !== true && row.excedeUmbralAML !== 1" class="text-gray-300">—</span>
            </td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef class="w-24 text-center">Ver</th>
            <td mat-cell *matCellDef="let row" class="text-center">
              <button mat-icon-button color="primary" (click)="openDetalle(row)" matTooltip="Ver expedientes">
                <mat-icon>visibility</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
              <div class="py-8 text-center text-gray-500">
                <mat-spinner *ngIf="loading" diameter="32" class="mx-auto mb-2"></mat-spinner>
                <ng-container *ngIf="!loading">
                  <mat-icon class="block mx-auto mb-2 text-4xl text-gray-400">inbox</mat-icon>
                  No hay clientes que coincidan con los filtros.
                </ng-container>
              </div>
            </td>
          </tr>
        </table>
      </div>
      <mat-paginator
        [length]="totalRecords"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        [pageSizeOptions]="pageSizeOptions"
        (page)="onPageChange($event)"
        showFirstLastButtons>
      </mat-paginator>
      <div class="mt-2 text-sm text-gray-600 text-center">
        Mostrando {{ getPageRange() }} de {{ totalRecords }} clientes
      </div>
    </mat-card-content>
  </mat-card>
</div>
