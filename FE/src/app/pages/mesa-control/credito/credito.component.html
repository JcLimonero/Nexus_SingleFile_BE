<div class="credito-container">
  <mat-card class="bg-white rounded-lg shadow-sm border border-gray-200 mb-2">
    <mat-card-content class="p-2">
      <div class="flex items-center gap-3 flex-wrap">
        <mat-form-field appearance="outline" class="min-w-48">
          <mat-label>Agencia</mat-label>
          <mat-select
            [value]="selectedAgencyId"
            (selectionChange)="onAgencyChange($event.value)"
            [disabled]="agenciesLoading || !hasAgencies()">
            <mat-option
              *ngFor="let agency of agencies; trackBy: trackByAgencyId"
              [value]="agency.Id">
              {{ agency.Name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="flex-1 min-w-64">
          <mat-label>Buscar cliente</mat-label>
          <input
            matInput
            [(ngModel)]="searchTerm"
            (keyup.enter)="buscar()"
            placeholder="Número de cliente o nombre"
            autocomplete="off">
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="button"
          (click)="buscar()"
          [disabled]="loading || !selectedAgencyId">
          <mat-icon>search</mat-icon>
          Buscar
        </button>
        <button
          *ngIf="searchTerm"
          mat-stroked-button
          type="button"
          (click)="limpiarBusqueda()">
          Limpiar
        </button>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="bg-white rounded-lg shadow-sm border border-gray-200">
    <mat-card-content class="p-2">
      <div *ngIf="loading" class="flex justify-center py-8">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <div *ngIf="!loading && clientes.length === 0" class="text-center py-8 text-gray-500">
        <mat-icon class="text-gray-400 mb-1" style="font-size: 36px;">search_off</mat-icon>
        <p>No hay clientes para mostrar</p>
      </div>

      <div *ngIf="!loading && clientes.length > 0" class="overflow-x-auto">
        <table mat-table [dataSource]="clientes" class="w-full clientes-table">
          <ng-container matColumnDef="ndCliente">
            <th mat-header-cell *matHeaderCellDef>N° Cliente</th>
            <td mat-cell *matCellDef="let row">{{ row.ndCliente || 'N/A' }}</td>
          </ng-container>

          <ng-container matColumnDef="cliente">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let row">{{ row.cliente || 'N/A' }}</td>
          </ng-container>

          <ng-container matColumnDef="rfc">
            <th mat-header-cell *matHeaderCellDef>RFC</th>
            <td mat-cell *matCellDef="let row">{{ row.rfc || 'N/A' }}</td>
          </ng-container>

          <ng-container matColumnDef="razonSocial">
            <th mat-header-cell *matHeaderCellDef>Razón social</th>
            <td mat-cell *matCellDef="let row">{{ row.razonSocial || 'N/A' }}</td>
          </ng-container>

          <ng-container matColumnDef="relaciones">
            <th mat-header-cell *matHeaderCellDef>Relaciones</th>
            <td mat-cell *matCellDef="let row">{{ row.relaciones }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
            class="cliente-row"
            (click)="abrirRelaciones(row)">
          </tr>
        </table>

        <mat-paginator
          [length]="total"
          [pageSize]="pageSize"
          [pageIndex]="pageIndex"
          [pageSizeOptions]="[10, 20, 50]"
          (page)="onPage($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
