<div class="dropdown">
  <!-- Header con info de usuario -->
  <div class="dropdown-header">
    <div class="dropdown-header-avatar">
      <mat-icon svgIcon="mat:person_outline"></mat-icon>
    </div>
    <div class="dropdown-header-info">
      <div class="dropdown-header-name">{{ (currentUser$ | async)?.name || 'Usuario' }}</div>
      <div class="dropdown-header-role">{{ (currentUser$ | async)?.role_name || 'Rol' }}</div>
    </div>
  </div>

  <!-- Items del menú -->
  <div class="dropdown-content">
    <!-- Estado en línea -->
    <div class="dropdown-item dropdown-item--status" [matMenuTriggerFor]="statusMenu">
      <mat-icon [svgIcon]="activeStatus.icon" [ngClass]="activeStatus.colorClass" class="dropdown-item-icon"></mat-icon>
      <span class="dropdown-item-label">{{ activeStatus.label }}</span>
      <mat-icon svgIcon="mat:chevron_right" class="dropdown-item-chevron"></mat-icon>
    </div>

    <a
      (click)="close()"
      *ngFor="let item of items; trackBy: trackById"
      [routerLink]="item.route"
      class="dropdown-item"
      matRipple>
      <mat-icon [svgIcon]="item.icon" class="dropdown-item-icon"></mat-icon>
      <span class="dropdown-item-label">{{ item.label }}</span>
    </a>
  </div>

  <!-- Separador + Cerrar Sesión -->
  <div class="dropdown-footer">
    <a (click)="logout()" class="dropdown-item dropdown-item--logout" matRipple>
      <mat-icon svgIcon="mat:logout" class="dropdown-item-icon dropdown-item-icon--logout"></mat-icon>
      <span class="dropdown-item-label">Cerrar Sesión</span>
    </a>
  </div>
</div>

<mat-menu #statusMenu="matMenu" xPosition="before" yPosition="below">
  <button
    (click)="setStatus(status)"
    *ngFor="let status of statuses; trackBy: trackById"
    mat-menu-item>
    <mat-icon [ngClass]="status.colorClass" [svgIcon]="status.icon"></mat-icon>
    <span>{{ status.label }}</span>
  </button>
</mat-menu>
