<vex-page-layout @stagger>
  <vex-secondary-toolbar current="Progress">

  </vex-secondary-toolbar>

  <vex-page-layout-content class="container">
    <vex-components-overview-progress
      @fadeInUp
      class="block"></vex-components-overview-progress>
  </vex-page-layout-content>
</vex-page-layout>
