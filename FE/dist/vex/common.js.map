<div class="card flex flex-col sm:flex-row">
  <div class="p-6 md:min-w-[300px]">
    <h2 class="title mt-0 mb-4">Preview</h2>
    <div class="flex flex-col">
      <mat-form-field>
        <button
          (click)="show()"
          *ngIf="!visible"
          mat-icon-button
          matIconPrefix
          type="button">
          <mat-icon svgIcon="mat:lock"></mat-icon>
        </button>
        <button
          (click)="hide()"
          *ngIf="visible"
          mat-icon-button
          matIconPrefix
          type="button">
          <mat-icon svgIcon="mat:lock_open"></mat-icon>
        </button>
        <mat-label>Password</mat-label>
        <input [type]="inputType" matInput value="Hello!" />
        <button
          (click)="show()"
          *ngIf="!visible"
          mat-icon-button
          matIconSuffix
          type="button">
          <mat-icon svgIcon="mat:visibility"></mat-icon>
        </button>
        <button
          (click)="hide()"
          *ngIf="visible"
          mat-icon-button
          matIconSuffix
          type="button">
          <mat-icon svgIcon="mat:visibility_off"></mat-icon>
        </button>
        <mat-hint
        >Try clicking the eye or the lock to toggle the visibility.
        </mat-hint>
      </mat-form-field>
    </div>
  </div>

  <div class="border-l flex-1">
    <div class="p-6">
      <h2 class="title mt-0 mb-4">Input</h2>
      <h4 class="body-2 text-secondary m-0">&lt;mat-input&gt;</h4>
    </div>

    <mat-tab-group>
      <mat-tab label="DESCRIPTION">
        <p class="p-6">
          Text fields typically reside in forms but can appear in other places,
          like dialog boxes and search.
        </p>
      </mat-tab>
      <mat-tab label="SOURCE CODE">
        <pre><code [vexHighlight]="inputHTML"></code></pre>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
