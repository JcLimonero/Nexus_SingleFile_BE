server {
    listen ${PORT};
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Body size for uploads (sync with php.ini upload_max_filesize)
    client_max_body_size 50M;

    # CORS preflight passthrough (handled by CI4)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        try_files /index.html @php;
    }

    location / {
        try_files $uri $uri/ @php;
    }

    location @php {
        rewrite ^(.+)$ /index.php?/$1 last;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 65s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Block dotfiles and known sensitive paths
    location ~ /\.(ht|env|git) { deny all; }
    location ~ ^/(writable|tests|app|system|vendor)(/|$) { deny all; }

    # Tiny static optimization for assets that DO live in BE/public
    location ~* \.(css|js|woff2|svg|ico|png|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
